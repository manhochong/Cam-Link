name: CamLink
options:
  bundleIdPrefix: hk.camlink
  deploymentTarget:
    iOS: "15.2"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "0.2.25"
  CURRENT_PROJECT_VERSION: "32"
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CamLink:
    type: application
    platform: iOS
    sources:
      - path: CamLink
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: ImageCaptureCore.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.camlink.ios
        INFOPLIST_FILE: CamLink/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: CamLink/Info.plist
      properties:
        CFBundleDisplayName: Cam Link
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
