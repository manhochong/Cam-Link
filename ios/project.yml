name: CamLink
options:
  bundleIdPrefix: hk.camlink
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "0.2.25"
  CURRENT_PROJECT_VERSION: "41"
  SWIFT_VERSION: "5.9"
  SWIFT_STRICT_CONCURRENCY: minimal
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CamLink:
    type: application
    platform: iOS
    sources:
      - path: CamLink
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: ImageCaptureCore.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.camlink.ios
        INFOPLIST_FILE: CamLink/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: "NO"
    # Use the committed Info.plist above. An `info` generation block would
    # replace it and silently remove privacy strings and the pairing URL scheme.
