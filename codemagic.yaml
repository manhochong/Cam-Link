workflows:
  ios-smoke:
    name: iOS smoke
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: hk.camlink.ios
        XCODE_SCHEME: CamLink
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
          python3 verify_metadata.py CamLink/Info.plist
      - name: Build for iOS device (unsigned)
        script: |
          set -euo pipefail
          # ImageCaptureCore is device-only; simulator SDK has no module.
          set +e
          xcodebuild \
            -project ios/CamLink.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-smoke \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > /tmp/camlink-xcodebuild.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "---- last 60 log lines ----"
            tail -n 60 /tmp/camlink-xcodebuild.log || true
            echo "---- swift errors ----"
            grep -nE 'error:|fatal error:' /tmp/camlink-xcodebuild.log || true
            exit "$status"
          fi
          python3 ios/verify_metadata.py build/ios-smoke/Build/Products/Debug-iphoneos/CamLink.app/Info.plist
          echo "unsigned iphoneos build ok"
    artifacts:
      - build/ios-smoke/Build/Products/Debug-iphoneos/*.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

  ios-testflight-internal:
    name: iOS TestFlight Internal
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CamLinkTestFlight
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: hk.camlink.ios
      vars:
        BUNDLE_ID: hk.camlink.ios
        XCODE_SCHEME: CamLink
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
          python3 verify_metadata.py CamLink/Info.plist
      - name: Set up internal TestFlight signing
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/CamLink.xcodeproj" \
            --scheme "$XCODE_SCHEME"
      - name: Verify signed IPA privacy and QR metadata
        script: |
          set -euo pipefail
          ipa=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$ipa"
          python3 ios/verify_metadata.py "$ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - CamLink Internal

  mac-receiver-smoke:
    name: Mac Receiver smoke
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Test receiver on macOS
        script: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          if ! command -v go >/dev/null 2>&1; then brew install go; fi
          go version
          mkdir -p build/mac-tests
          GO111MODULE=off go test -race -v ./mac | tee build/mac-tests/results.txt
      - name: Package universal macOS app
        script: |
          set -euo pipefail
          python3 -m venv /tmp/camlink-package-env
          /tmp/camlink-package-env/bin/python -m pip install Pillow
          /tmp/camlink-package-env/bin/python tools/package_mac_receiver.py
          echo 'Universal test bundle built; Developer ID signing/notarization and interactive GUI validation remain separate.'
    artifacts:
      - release/CamLink-Receiver-macOS.zip
      - build/mac-tests/results.txt
