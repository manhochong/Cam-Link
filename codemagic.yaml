workflows:
  ios-smoke:
    name: iOS smoke
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: hk.camlink.ios
        XCODE_SCHEME: CamLink
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build for iOS device (unsigned)
        script: |
          set -euo pipefail
          # ImageCaptureCore is device-only; simulator SDK has no module.
          set +e
          xcodebuild \
            -project ios/CamLink.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > /tmp/camlink-xcodebuild.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "---- last 60 log lines ----"
            tail -n 60 /tmp/camlink-xcodebuild.log || true
            echo "---- swift errors ----"
            grep -nE 'error:|fatal error:' /tmp/camlink-xcodebuild.log || true
            exit "$status"
          fi
          echo "unsigned iphoneos build ok"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

  ios-testflight-internal:
    name: iOS TestFlight Internal
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CamLinkTestFlight
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: hk.camlink.ios
      vars:
        BUNDLE_ID: hk.camlink.ios
        XCODE_SCHEME: CamLink
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up internal TestFlight signing
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/CamLink.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - CamLink Internal
