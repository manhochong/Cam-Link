workflows:
  ios-smoke:
    name: iOS smoke
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: hk.camlink.ios
        XCODE_SCHEME: CamLink
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build for iOS device (unsigned)
        script: |
          set -euo pipefail
          # ImageCaptureCore is device-only; simulator SDK has no module.
          xcodebuild \
            -project ios/CamLink.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
